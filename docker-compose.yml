# Production стек: web (Gunicorn) + celery + celery-beat + db + redis + nginx.
# Використовує образ, побудований з кореневого Dockerfile (multi-stage).
#
# Запуск:
#   docker compose up -d --build       — підняти стек
#   docker compose logs -f web         — логи бекенду
#   docker compose exec web python manage.py createsuperuser
#   docker compose down                — зупинити (volumes лишаються)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bugtracker}
      POSTGRES_USER: ${POSTGRES_USER:-bugtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugtracker_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # БД доступна лише з мережі compose (web/celery), назовні не виставляємо
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugtracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Redis доступний лише з мережі compose, назовні не виставляємо
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn bugtracker.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-bugtracker}:${POSTGRES_PASSWORD:-bugtracker_dev}@db:5432/${POSTGRES_DB:-bugtracker}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    # Gunicorn доступний лише через nginx (через мережу compose), не назовні
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    command: celery -A bugtracker worker -l info
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-bugtracker}:${POSTGRES_PASSWORD:-bugtracker_dev}@db:5432/${POSTGRES_DB:-bugtracker}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A bugtracker beat -l info
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-bugtracker}:${POSTGRES_PASSWORD:-bugtracker_dev}@db:5432/${POSTGRES_DB:-bugtracker}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    # Хост:Контейнер — на хості порт 8082 (бо 80 зайнятий), всередині nginx
    # все одно слухає 80. Доступ ззовні: http://<IP>:8082
    ports:
      - "8082:80"
    depends_on:
      web:
        condition: service_healthy

  # ---- Опціональний моніторинг (profile: monitoring) ----
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus

  # ---- Опціональні бекапи (profile: backups) ----
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    profiles: ["backups"]
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-bugtracker}
      - POSTGRES_USER=${POSTGRES_USER:-bugtracker}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bugtracker_dev}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes:
      - ./backups:/backups
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  prometheus_data:
  grafana_data:
