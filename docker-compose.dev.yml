# Dev-стек з hot-reload для backend (runserver) і frontend (Vite).
#
# Перший запуск:
#   docker compose -f docker-compose.dev.yml up --build
#
# Подальші запуски:
#   docker compose -f docker-compose.dev.yml up
#
# Доступ:
#   Frontend: http://localhost:5173
#   Backend:  http://localhost:8000
#   Postgres: localhost:5432  (user/pass: bugtracker / bugtracker_dev)
#   Redis:    localhost:6379

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bugtracker
      POSTGRES_USER: bugtracker
      POSTGRES_PASSWORD: bugtracker_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [bt]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [bt]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    networks: [bt]
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-not-for-production
      - DATABASE_URL=postgres://bugtracker:bugtracker_dev@db:5432/bugtracker
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks: [bt]
    environment:
      - VITE_API_BASE=http://localhost:8000
      # Vite proxy всередині контейнера ходить за /api на http://backend:8000
      - BACKEND_URL=http://backend:8000
      - VITE_NO_OPEN=1
    depends_on:
      - backend

networks:
  bt:
    driver: bridge

volumes:
  postgres_data_dev:
